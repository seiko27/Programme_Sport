<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme sport à la maison</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#14202B;--mute:#5B6B79;--line:#D5DCE3;--acc:#1F6FEB;--accsoft:#E1ECFD;--onacc:#fff;--ok:#1E9E62;
--fh:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151C;--card:#17212B;--ink:#EAF0F5;--mute:#9AAAB8;--line:#2A3745;--accsoft:#1B2B44;--ok:#4CD08F}}
:root[data-theme="dark"]{--bg:#0E151C;--card:#17212B;--ink:#EAF0F5;--mute:#9AAAB8;--line:#2A3745;--accsoft:#1B2B44;--ok:#4CD08F}
body.f{--acc:#8B4DFF;--accsoft:#EEE3FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.f{--accsoft:#2A1F47}}
:root[data-theme="dark"] body.f{--accsoft:#2A1F47}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--fb);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 190px}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:.2px}
/* accueil */
.home{display:flex;flex-direction:column;min-height:calc(100vh - 40px);justify-content:center;gap:14px;padding-bottom:20px}
.home h1{font-size:clamp(44px,13vw,72px);line-height:.95;font-weight:700}
.home p{color:var(--mute);margin:0 0 10px;max-width:34ch}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:22px 20px;border:2px solid var(--ink);border-radius:6px;background:var(--card);transition:transform .12s}
.pick:active{transform:scale(.98)}
.pick b{font:700 44px/1 var(--fh)}
.pick span{color:var(--mute)}
.pick.m{border-color:#1F6FEB}.pick.m b{color:#1F6FEB}
.pick.w{border-color:#8B4DFF}.pick.w b{color:#8B4DFF}
/* programme */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.back{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px}
.title{font-size:42px;line-height:1;font-weight:700;color:var(--acc);margin:10px 0 2px}
.meta{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.tab small{opacity:.75;margin-left:4px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px}
.sechead h2{font-size:30px}
.sechead span{color:var(--mute);font-size:14px}
.ex{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:6px;padding:14px;margin-bottom:12px}
.ex.done{border-left-color:var(--ok)}
.ex h3{font-size:25px;line-height:1.1}
.ex .vol{font:600 18px var(--fh);color:var(--acc);margin:2px 0 6px}
.ex p{margin:0 0 10px;color:var(--mute);font-size:15px}
.sets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.set{min-width:52px;height:44px;border-radius:6px;border:2px solid var(--acc);background:transparent;font:700 18px var(--fh)}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.hold{height:44px;padding:0 14px;border-radius:6px;border:0;background:var(--accsoft);font-weight:600}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}
/* chrono */
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--acc);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.tin{max-width:640px;margin:0 auto}
.trow{display:flex;align-items:center;gap:10px}
.clock{font:700 52px/1 var(--fh);font-variant-numeric:tabular-nums;min-width:112px}
.clock.end{color:var(--ok)}
.lab{flex:1;color:var(--mute);font-size:14px;line-height:1.2}
.ctl{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:18px}
.ctl.g{background:var(--accsoft);color:var(--ink);font-size:14px;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:2px}
.pre{display:flex;gap:6px}
.pre button{flex:1;height:36px;border:1px solid var(--line);background:transparent;border-radius:6px;font-weight:600}
.pre button:active{background:var(--accsoft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer" hidden>
 <div class="tin">
  <div class="trow">
   <div class="clock" id="clock">00:00</div>
   <div class="lab" id="lab">Chrono</div>
   <button class="ctl g" id="m10" aria-label="Ajouter 10 secondes">+10</button>
   <button class="ctl" id="pp" aria-label="Pause ou reprise">⏸</button>
   <button class="ctl g" id="rs" aria-label="Arrêter le chrono">✕</button>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="pre" id="pre"></div>
 </div>
</div>
<script>
var S=function(n,s,r,d,h){return{n:n,s:s,r:r,d:d,h:h||0}};
var WARM=function(a){return{t:"Échauffement",rest:0,note:"5 minutes · 1 min par mouvement",x:a.map(function(x){return S(x[0],1,"1 min",x[1],60)})}};
var D={
f:{name:"Femme",sub:"Fessiers, abdos et bras",secs:[
 WARM([["Marche rapide sur place","Garde un rythme soutenu."],["Rotations des bras","Grands cercles, avant puis arrière."],["Squats légers","Amplitude réduite pour chauffer les jambes."],["Montées de genoux","Sans sauter."],["Rotations du bassin","Mobilise aussi les hanches."]]),
 {t:"Fessiers",rest:60,note:"Repos 45 à 60 s",x:[
  S("Squats",3,"15","Pieds à la largeur des épaules, descends en poussant les hanches vers l’arrière, remonte en contractant les fessiers."),
  S("Pont fessier",4,"15","Allongée sur le dos, pieds au sol, monte le bassin et serre les fessiers 2 secondes en haut."),
  S("Fentes arrière",3,"10 par jambe","Recule une jambe, fléchis les deux genoux en gardant le buste droit, reviens debout."),
  S("Donkey kicks",3,"12 par jambe","À quatre pattes, pousse un pied vers le plafond sans cambrer le bas du dos.")]},
 {t:"Abdos",rest:45,note:"Repos 30 à 45 s",x:[
  S("Crunchs",3,"15","Décolle légèrement les épaules du sol, sans tirer sur la nuque."),
  S("Gainage sur les avant-bras",3,"30 s","Ventre engagé, dos droit, respire normalement.",30),
  S("Relevés de bassin",3,"12","Allongée sur le dos, ramène les genoux vers la poitrine en décollant doucement le bassin."),
  S("Abdos vélo",3,"20 alternées","Amène le coude vers le genou opposé, sans forcer sur la nuque.")]},
 {t:"Bras",rest:60,note:"Repos 45 à 60 s",x:[
  S("Pompes sur les genoux",3,"8 à 12","Corps aligné des genoux à la tête. Triceps, épaules et pectoraux."),
  S("Curl biceps (bouteilles d’eau)",3,"12","Coudes près du corps, sans balancer le buste."),
  S("Extensions triceps au-dessus de la tête",3,"12","Une bouteille à deux mains, plie les coudes derrière la tête, puis tends les bras.")]}
]},
h:{name:"Homme",sub:"Abdos, pectoraux et bras",secs:[
 WARM([["Marche rapide ou petits sauts","Sans impact."],["Rotations épaules et bras","Mobilise bien les épaules."],["Pompes contre un mur","Mouvement lent et contrôlé."],["Poignets et coudes","Petits cercles, flexions douces."],["Gainage léger et dos","Mobilisation douce du dos."]]),
 {t:"Pectoraux",rest:90,note:"Repos 60 à 90 s",x:[
  S("Pompes classiques",4,"10 à 15","Mains un peu plus écartées que les épaules, corps aligné, poitrine proche du sol. Sur les genoux si trop dur."),
  S("Pompes larges",3,"8 à 12","Mains un peu plus larges que pour les pompes classiques, sans exagérer."),
  S("Pompes inclinées",3,"12","Mains sur un support stable (plan de travail solide), corps droit.")]},
 {t:"Abdos",rest:45,note:"Repos 30 à 45 s",x:[
  S("Crunchs classiques",3,"20","Enroule légèrement le haut du dos et contracte les abdos à chaque répétition."),
  S("Gainage",3,"40 s","Bassin stable, évite de creuser le dos.",40),
  S("Relevés de jambes",3,"10 à 12","Monte et descends les jambes de façon contrôlée, bas du dos collé au tapis. Plie les genoux si besoin."),
  S("Abdos vélo",3,"20 alternées","Alterne les côtés sans tirer sur la tête et sans accélérer.")]},
 {t:"Bras",rest:60,note:"Repos 45 à 60 s (90 s après les exos les plus durs)",x:[
  S("Curl biceps",3,"12","Haltères ou bouteilles : plie les coudes sans bouger les épaules."),
  S("Extensions triceps",3,"12","Charge à deux mains au-dessus de la tête, fléchis les coudes puis tends les bras."),
  S("Curl marteau",3,"10 à 12","Paumes face à face pendant tout le mouvement."),
  S("Pompes prise serrée",3,"8 à 10","Mains un peu moins larges que les épaules, coudes près du corps. Sur les genoux si besoin.")]}
]}};
var app=document.getElementById("app"),who=null,tab=0,done={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function home(){
 who=null;document.body.className="";
 app.innerHTML='<div class="home"><h1>Sport<br>à la maison</h1><p>Choisis ton programme. 3 séances par semaine, 30 à 40 minutes, sans salle.</p>'+
 '<button class="pick w" data-w="f"><b>Femme</b><span>Fessiers, abdos et bras</span></button>'+
 '<button class="pick m" data-w="h"><b>Homme</b><span>Abdos, pectoraux et bras</span></button></div>';
}
function key(i,j){return who+tab+"-"+i+"-"+j}
function count(si){var p=D[who].secs[si],n=0,t=0;p.x.forEach(function(e,j){t+=e.s;for(var k=0;k<e.s;k++)if(done[who+si+"-"+j+"-"+k])n++});return[n,t]}
function prog(){
 var P=D[who],sec=P.secs[tab];document.body.className=who;
 var h='<div class="top"><button class="back" id="back">← Changer</button></div>'+
 '<h1 class="title">'+P.name+'</h1><p class="meta">'+P.sub+' · 3 séances par semaine</p><div class="tabs" role="tablist">';
 P.secs.forEach(function(s,i){var c=count(i);h+='<button class="tab" role="tab" aria-selected="'+(i==tab)+'" data-t="'+i+'">'+s.t+'<small>'+c[0]+'/'+c[1]+'</small></button>'});
 h+='</div><div class="sechead"><h2>'+sec.t+'</h2><span>'+sec.note+'</span></div>';
 sec.x.forEach(function(e,j){
  var all=true,chips="";
  for(var k=0;k<e.s;k++){var d=!!done[who+tab+"-"+j+"-"+k];if(!d)all=false;
   chips+='<button class="set" aria-pressed="'+d+'" aria-label="Série '+(k+1)+'" data-j="'+j+'" data-k="'+k+'">'+(k+1)+'</button>'}
  h+='<div class="ex'+(all?" done":"")+'"><h3>'+esc(e.n)+'</h3><div class="vol">'+(e.s>1?e.s+' séries × ':'')+esc(e.r)+'</div><p>'+esc(e.d)+'</p><div class="sets">'+chips+
  (e.h?'<button class="hold" data-hold="'+j+'">▶ Chrono '+e.h+' s</button>':'')+'</div>'+
  (sec.rest&&e.s>1?'<p class="hint">Touche une série terminée : le repos de '+sec.rest+' s démarre.</p>':'')+'</div>';
 });
 app.innerHTML=h;
}
app.addEventListener("click",function(ev){
 var b=ev.target.closest("button");if(!b)return;
 if(b.dataset.w){who=b.dataset.w;tab=0;prog();window.scrollTo(0,0);return}
 if(b.id=="back"){stop();home();return}
 if(b.dataset.t!==undefined){tab=+b.dataset.t;prog();window.scrollTo(0,0);return}
 var sec=D[who].secs[tab];
 if(b.dataset.hold!==undefined){var e=sec.x[+b.dataset.hold];start(e.h,e.n);return}
 if(b.dataset.k!==undefined){
  var j=+b.dataset.j,k=+b.dataset.k,kk=who+tab+"-"+j+"-"+k,e2=sec.x[j],y=window.scrollY;
  done[kk]=!done[kk];prog();window.scrollTo(0,y);
  if(done[kk]&&sec.rest&&e2.s>1&&k<e2.s-1)start(sec.rest,"Repos · "+e2.n);
 }
});
/* chrono */
var T=document.getElementById("timer"),clock=document.getElementById("clock"),lab=document.getElementById("lab"),fill=document.getElementById("fill"),pp=document.getElementById("pp");
var total=0,left=0,end=0,run=false,iv=null,ac=null;
[30,45,60,90].forEach(function(s){var b=document.createElement("button");b.textContent=s+" s";b.onclick=function(){start(s,"Repos")};document.getElementById("pre").appendChild(b)});
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function draw(){clock.textContent=fmt(left);fill.style.width=(total?100*(1-left/total):0)+"%";pp.textContent=run?"⏸":"▶"}
function beep(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();for(var i=0;i<n;i++){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);var t=ac.currentTime+i*.25;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function tick(){left=(end-Date.now())/1000;if(left<=0){left=0;run=false;clearInterval(iv);clock.classList.add("end");lab.textContent="Terminé, c’est reparti !";beep(3)}draw()}
function start(s,l){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 clearInterval(iv);T.hidden=false;total=left=s;end=Date.now()+s*1000;run=true;lab.textContent=l;clock.classList.remove("end");iv=setInterval(tick,250);draw()}
function stop(){clearInterval(iv);run=false;T.hidden=true}
pp.onclick=function(){if(left<=0){return}if(run){run=false;clearInterval(iv);left=(end-Date.now())/1000}else{run=true;end=Date.now()+left*1000;iv=setInterval(tick,250)}draw()};
document.getElementById("rs").onclick=stop;
document.getElementById("m10").onclick=function(){if(left<=0){start(10,"Chrono");return}total+=10;left+=10;if(run)end+=10000;clock.classList.remove("end");draw()};
home();
</script>
</body>
</html>
